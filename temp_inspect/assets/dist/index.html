<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Scanner UI Clone Fullscreen</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            /* Ensure the body takes up the full viewport height */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        .app-container {
            width: 100%;
            /* Remove max-width to allow full screen width on mobile */
            /* max-width: 400px; */
            background-color: white;
            padding: 20px;
            box-sizing: border-box;
            /* Use flexbox for vertical alignment and space distribution */
            display: flex;
            flex-direction: column;
            height: 100%; /* Take full height of the body */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px 10px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            /* This area will occupy only the space it needs at the top */
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .icon {
            font-size: 32px;
            color: #007bff; /* A blue color similar to the image */
            margin-bottom: 8px;
            line-height: 1;
        }

        .item-text {
            font-size: 12px;
            line-height: 1.2;
            word-break: break-word;
            padding: 0 5px;
        }

        .footer {
            padding-top: 20px;
            margin-top: auto; /* Pushes the footer to the bottom using flexbox */
        }

        .connection-status {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .status-label {
            color: #333;
        }

        .status-value {
            font-weight: bold;
        }

        .disconnected {
            color: #dc3545; /* Red color */
        }

        .buttons-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 0;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            flex-grow: 1;
        }

        .btn-connect {
            background-color: #28a745; /* Green color */
            color: white;
            margin-right: 10px;
        }

        .btn-demo {
            background-color: #28a745; /* Green color */
            color: white;
            margin-left: 10px;
        }
        /* Specific icon adjustments for better representation */
        .icon-gear {
            transform: scale(1.2);
        }

        .icon-car {
            transform: scale(1.1);
        }

        .icon-list {
            font-size: 30px;
        }

        .icon-chart {
            font-size: 30px;
        }

        .icon-accelerometer {
            font-size: 28px;
        }

        .icon-testtube {
            font-size: 28px;
        }
    </style>
    <script type="text/javascript" src="bridge.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="grid-container">
            <!-- Row 1 -->
            <div class="grid-item" onclick="JSBridge.testDashboardPage()">
                <div class="icon">📈</div>
                <div class="item-text">Dashboard</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testLiveDataPage()">
                <div class="icon">📊</div>
                <div class="item-text">Live data</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testSensorsPage()">
                <div class="icon icon-list">📋</div>
                <div class="item-text">All sensors</div>
            </div>
            <!-- Row 2 -->
            <div class="grid-item" onclick="JSBridge.testDTCPage()">
                <div class="icon">🔧</div>
                <div class="item-text">Diagnostic trouble codes</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testFreezeFramePage()">
                <div class="icon">💾</div>
                <div class="item-text">Freeze frame</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testMode06Page()">
                <div class="icon">✅</div>
                <div class="item-text">Noncontinuous Monitors</div>
            </div>
            <!-- Row 3 -->
            <div class="grid-item">
                <div class="icon">🛒</div>
                <div class="item-text">Upgrade Pro</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testGaragePage()">
                <div class="icon icon-car">🚗</div>
                <div class="item-text">My cars</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testSettingsPage()">
                <div class="icon icon-gear">⚙️</div>
                <div class="item-text">Settings</div>
            </div>
            <!-- Row 4 -->
            <div class="grid-item" onclick="JSBridge.testFuelStatsPage()">
                <div class="icon">⛽</div>
                <div class="item-text">Statistics</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testECUInfoPage()">
                <div class="icon">🧠</div>
                <div class="item-text">ECU identifiers</div>
            </div>
            <div class="grid-item" onclick="JSBridge.testRecordsPage()">
                <div class="icon">🔴REC</div>
                <div class="item-text">Data recording</div>
            </div>
            <!-- Row 5 -->
            <div class="grid-item" onclick="JSBridge.testSpeedPage()">
                <div class="icon icon-accelerometer">📶</div>
                <div class="item-text">Acceleration tests</div>
            </div>

            <div class="grid-item" onclick="JSBridge.testEmissionPage()">
                <div class="icon icon-testtube">🧪</div>
                <div class="item-text">Emission tests</div>
            </div>
            <div class="grid-item">
                <!-- Empty item for alignment -->
            </div>
        </div>

        <div class="footer">
            <div class="connection-status">
                <span class="status-label">ELM connection:</span>
                <span class="status-value disconnected" id="elm-status">Disconnected</span>
            </div>
            <div class="connection-status">
                <span class="status-label">ECU connection:</span>
                <span class="status-value disconnected" id="ecu-status">Disconnected</span>
            </div>
            <div class="buttons-container">
                <button class="btn btn-connect" id="btn-connect" onclick="JSBridge.connectAsync('wifi', '192.168.0.10:35000')">CONNECT</button>
                <button class="btn btn-demo" onclick="invokeCSharp()">Demo</button>
            </div>
        </div>
    </div>
</body>
</html>
