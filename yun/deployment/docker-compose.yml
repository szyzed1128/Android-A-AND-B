# Docker Compose配置 - OBD云端服务
# 包含Android模拟器和Nginx代理

version: '3.8'

services:
  # Android模拟器 - 运行OBD诊断应用
  android-emulator:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: obd-android
    privileged: true
    ports:
      - "5555:5555"   # ADB
      - "6080:6080"   # noVNC可视化
      - "8080:8080"   # WebSocket内部端口
    environment:
      - DEVICE=Samsung Galaxy S10
      - DATAPARTITION=4g
      - WEB_VNC=true
    volumes:
      - /dev/kvm:/dev/kvm  # KVM加速
    healthcheck:
      test: ["CMD", "adb", "shell", "getprop", "sys.boot_completed"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # Nginx反向代理 (可选，生产环境使用)
  nginx:
    image: nginx:alpine
    container_name: obd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL证书目录
    depends_on:
      android-emulator:
        condition: service_healthy
    restart: unless-stopped

# 网络配置
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
