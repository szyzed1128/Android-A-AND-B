# Nginx配置 - OBD云端WebSocket代理
# 用于反向代理Android模拟器中的WebSocket服务

# 上游服务器 - Android模拟器中的WebSocket
upstream obd_websocket {
    server 127.0.0.1:8080;
    keepalive 64;
}

# HTTP服务器
server {
    listen 80;
    server_name obd-gateway.example.com;

    # 重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器
server {
    listen 443 ssl http2;
    server_name obd-gateway.example.com;

    # SSL证书配置 (使用Let's Encrypt或自签名证书)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 日志
    access_log /var/log/nginx/obd_access.log;
    error_log /var/log/nginx/obd_error.log;

    # WebSocket端点
    location /ws {
        proxy_pass http://obd_websocket;
        proxy_http_version 1.1;

        # WebSocket必需的头
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;  # WebSocket长连接

        # 缓冲区
        proxy_buffering off;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # 默认拒绝其他请求
    location / {
        return 404;
    }
}
